<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Contacto</title>

<style>
body{
    margin:0;
    background:#fff5e4;
    font-family:Arial,sans-serif;
}

header{
    background:linear-gradient(90deg,#ff7b54,#ffb26b,#ffd56f);
    color:white;
    text-align:center;
    padding:35px;
}

nav{
    background:#ff914d;
    text-align:center;
    padding:15px;
}

nav a{
    color:white;
    text-decoration:none;
    margin:10px;
    padding:10px 20px;
    background:#ffb26b;
    border-radius:25px;
}

form{
    width:450px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

input,textarea{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:2px solid #ffb26b;
    border-radius:10px;
}

button{
    background:#ff914d;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:25px;
    margin-top:15px;
    cursor:pointer;
}

button:hover{
    background:#ff7b54;
}
</style>

</head>

<body>

<header>
    <h1>📩 Únete al Club</h1>

<nav>
    <a href="index.html">🏠 Inicio</a>
    <a href="mascotas.html">🐾 Mascotas</a>
    <a href="galeria.html">📸 Galería</a>

    <a href="contacto.html">📩 Contacto</a>
</nav>

<form>
    <label>Nombre</label>
    <input type="text">

    <label>Correo Electrónico</label>
    <input type="email">

    <label>Mensaje</label>
    <textarea rows="5"></textarea>

    <button type="submit">🐾 Enviar Solicitud</button>
</form>

</html>
