<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>📩 Contacto | Club Amigos Peludos</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#fff5e4;
}

header{
    background:linear-gradient(90deg,#ff7b54,#ffb26b,#ffd56f);
    color:white;
    text-align:center;
    padding:35px;
}

header h1{
    margin:0;
    font-size:2.5rem;
}

header p{
    font-size:1.2rem;
}

nav{
    background:#ff914d;
    padding:15px;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
}

nav a{
    text-decoration:none;
    color:white;
    background:#ffb26b;
    padding:12px 22px;
    border-radius:25px;
    font-weight:bold;
    transition:0.3s;
}

nav a:hover{
    background:white;
    color:#ff914d;
}

form{
    width:90%;
    max-width:600px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
    box-sizing:border-box;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:5px;
    font-weight:bold;
    color:#555;
}

input,
textarea{
    width:100%;
    padding:12px;
    border:2px solid #ffb26b;
    border-radius:10px;
    box-sizing:border-box;
    font-size:16px;
}

textarea{
    resize:vertical;
}

button{
    margin-top:20px;
    background:#ff914d;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:25px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
}

button:hover{
    background:#ff7b54;
}

.info{
    text-align:center;
    margin:20px;
    color:#555;
}

footer{
    background:#ff914d;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:30px;
}

@media (max-width:768px){

    header h1{
        font-size:2rem;
    }

    nav{
        flex-direction:column;
        align-items:center;
    }

    nav a{
        width:85%;
        text-align:center;
    }

    form{
        width:95%;
    }
}

</style>

</head>

<body>

<header>
    <h1>📩 Contacto</h1>
    <p>¡Únete a nuestra comunidad de amantes de las mascotas!</p>
</header>

<nav>
    <a href="index.html">🏠 Inicio</a>
    <a href="mascotas.html">🐾 Mascotas</a>
    <a href="galeria.html">📸 Galería</a>
    <a href="cuidados.html">❤️ Cuidados</a>
    <a href="eventos.html">🎉 Eventos</a>
    <a href="contacto.html">📩 Contacto</a>
</nav>

<div class="info">
    <h2>🐾 Queremos conocerte</h2>
    <p>
        Si deseas formar parte del club o tienes alguna pregunta,
        completa el siguiente formulario.
    </p>
</div>

<form>

    <label>Nombre</label>
    <input type="text" placeholder="Escribe tu nombre">

    <label>Correo electrónico</label>
    <input type="email" placeholder="correo@ejemplo.com">

    <label>Mensaje</label>
    <textarea rows="5" placeholder="Escribe tu mensaje"></textarea>

    <button type="submit">
        🐾 Enviar mensaje
    </button>

</form>

<footer>
    🐾 Club Amigos Peludos | 2026
</footer>

</body>
</html>
