<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Contacto</title>

<style>
body{
    margin:0;
    background:#fff5e4;
    font-family:Arial,sans-serif;
}

header{
    background:linear-gradient(90deg,#ff7b54,#ffb26b,#ffd56f);
    color:white;
    text-align:center;
    padding:35px;
}

nav{
    background:#ff914d;
    text-align:center;
    padding:15px;
}

nav a{
    color:white;
    text-decoration:none;
    margin:10px;
    padding:10px 20px;
    background:#ffb26b;
    border-radius:25px;
}

form{
    width:90%;
    max-width:600px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
    box-sizing:border-box;
}

input,textarea{
    width:100%;
    box-sizing:border-box;
}

@media screen and (max-width:768px){

    header{
        padding:25px 15px;
    }

    header h1{
        font-size:2rem;
    }

    header p{
        font-size:1rem;
    }

    nav{
        display:flex;
        flex-wrap:wrap;
        justify-content:center;
        gap:8px;
    }

    nav a{
        font-size:0.9rem;
        padding:10px 15px;
    }

    .tarjeta,
    .evento,
    .bienvenida,
    form{
        width:90%;
        max-width:none;
    }

    img{
        max-width:100%;
        height:auto;
    }
}

button{
    background:#ff914d;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:25px;
    margin-top:15px;
    cursor:pointer;
}

button:hover{
    background:#ff7b54;
}
</style>

</head>

<body>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<header>
    <h1>📩 Únete al Club</h1>
    <p>¡Forma parte de nuestra comunidad!</p>
</header>

<nav>
    <a href="index.html">🏠 Inicio</a>
    <a href="mascotas.html">🐾 Mascotas</a>
    <a href="galeria.html">📸 Galería</a>
    <a href="cuidados.html">❤️ Cuidados</a>
    <a href="eventos.html">🎉 Eventos</a>
    <a href="contacto.html">📩 Contacto</a>
</nav>

<form>
    <label>Nombre</label>
    <input type="text">

    <label>Correo Electrónico</label>
    <input type="email">

    <label>Mensaje</label>
    <textarea rows="5"></textarea>

    <button type="submit">🐾 Enviar Solicitud</button>
</form>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
