<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>📸 Galería | Club Amigos Peludos</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#eae3d6;
}

header{
    background:linear-gradient(90deg,#ff7b54,#ffb26b,#ffd56f);
    color:white;
    text-align:center;
    padding:35px;
}

header h1{
    margin:0;
    font-size:2.5rem;
}

header p{
    font-size:1.2rem;
}

nav{
    background:#ff914d;
    padding:15px;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
}

nav a{
    text-decoration:none;
    color:white;
    background:#ffb26b;
    padding:12px 22px;
    border-radius:25px;
    font-weight:bold;
    transition:0.3s;
}

nav a:hover{
    background:white;
    color:#ff914d;
}

.galeria{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:30px;
    padding:40px;
}

.galeria img{
    width:320px;
    height:250px;
    object-fit:cover;
    border:6px solid white;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.25);
    transition:0.3s;
}

.galeria img:hover{
    transform:scale(1.05);
}

footer{
    background:#ff914d;
    color:white;
    text-align:center;
    padding:15px;
}

@media (max-width:768px){

    header h1{
        font-size:2rem;
    }

    nav{
        flex-direction:column;
        align-items:center;
    }

    nav a{
        width:85%;
        text-align:center;
    }

    .galeria{
        padding:20px;
    }

    .galeria img{
        width:95%;
        height:auto;
    }
}

</style>

</head>

<body>

<header>
    <h1>📸 Galería de Momentos</h1>
    <p>Los mejores recuerdos de nuestros amigos peludos</p>
</header>

<nav>
    <a href="index.html">🏠 Inicio</a>
    <a href="mascotas.html">🐾 Mascotas</a>
    <a href="galeria.html">📸 Galería</a>
    <a href="cuidados.html">❤️ Cuidados</a>
    <a href="eventos.html">🎉 Eventos</a>
    <a href="contacto.html">📩 Contacto</a>
</nav>

<div class="galeria">

    <img src="perro-y-gato.jpg" alt="Perro y gato">

    <img src="serpiente.webp" alt="Serpiente">

    <img src="hamster.jpg" alt="Hámster">

    <img src="cool.jpg" alt="Mascotas">

    <img src="tortuga-lol.jpg" alt="Tortuga">

    <img src="tortuga-pañal.jpg" alt="Tortuga">

    <img src="pollo.jpg" alt="pollo">

    <img src="pony-lol.jpg" alt="Pony">

    <img src="rata.jpg" alt="Ratón">

</div>

<footer>
    🐾 Club Amigos Peludos
</footer>

</body>
</html>
